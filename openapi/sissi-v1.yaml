openapi: 3.0.3
info:
  title: SiSSi step 1 API
  version: 1.0.0
  description: >
    Source of truth for the step 1 web signage service (docs/plans/step-1-web-signage.md).
    Served under SISSI_PUBLIC_PATH (default /signage); paths below are relative to that prefix.
servers:
  - url: /signage/api/v1
security:
  - bearer: []
paths:
  /v/{viewId}/playlist.json:
    get:
      operationId: getViewPlaylist
      description: Public (no secret). Enabled entries of a view; an aggregate joins its members in order. CORS only for the view's allowedOrigins.
      parameters:
        - { name: viewId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' } }
      responses:
        '200':
          description: View playlist
        '404':
          description: Unknown view (screens are not views)
  /v/{viewId}/frame:
    get:
      operationId: getViewFrame
      description: Standalone page for an iframe. Content-Security-Policy frame-ancestors lists the view's allowedOrigins ('none' when empty).
      parameters:
        - { name: viewId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' } }
      responses:
        '200': { description: HTML page }
        '404': { description: Unknown view }
  /v/{viewId}/embed.js:
    get:
      operationId: getViewEmbedScript
      description: Script embed. Renders the view into every element with the attribute data-sissi-embed in a shadow root, placed before the script tag.
      parameters:
        - { name: viewId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' } }
      responses:
        '200': { description: JavaScript }
        '404': { description: Unknown view }
  /screens:
    get:
      operationId: listScreens
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [screen, view, aggregate] }
      responses:
        '200':
          description: Screens for the plugin picker
          content:
            application/json:
              schema:
                type: object
                required: [screens]
                properties:
                  screens:
                    type: array
                    items: { $ref: '#/components/schemas/Screen' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /push:
    post:
      operationId: createPush
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '202':
          description: Accepted
          headers:
            Location: { schema: { type: string }, description: '<SISSI_PUBLIC_PATH>/api/v1/push/{pushId}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushAccepted' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /push/{pushId}:
    get:
      operationId: getPush
      parameters:
        - { name: pushId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Push status (kept 24 h)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/login:
    post:
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string } }
      responses:
        '204': { description: Session cookie set }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /admin/screens:
    get:
      operationId: adminListScreens
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Screens with entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  screens:
                    type: array
                    items: { $ref: '#/components/schemas/AdminScreen' }
    post:
      operationId: adminCreateScreen
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminScreen' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/screens/{screenId}:
    parameters:
      - { name: screenId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminUpdateScreen
      security: [{ adminCookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenInput' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteScreen
      security: [{ adminCookie: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /admin/screens/{screenId}/entries:
    parameters:
      - { name: screenId, in: path, required: true, schema: { type: string } }
    put:
      operationId: adminReorderEntries
      description: Body is the full ordered list of entryIds; must be a permutation of the current ones.
      security: [{ adminCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [entryIds]
              properties:
                entryIds: { type: array, items: { type: string } }
      responses:
        '200': { description: Reordered, playlist version incremented }
        '422': { $ref: '#/components/responses/Error' }
  /admin/screens/{screenId}/entries/{entryId}:
    parameters:
      - { name: screenId, in: path, required: true, schema: { type: string } }
      - { name: entryId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminUpdateEntry
      security: [{ adminCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: { type: integer, minimum: 1, maximum: 3600 }
                enabled: { type: boolean, description: true makes the entry live, false takes it off the screen (live change). }
                startDatetime: { type: string, format: date-time, nullable: true, description: 'ISO 8601 with UTC offset. Before this the entry is not in any playlist. null = no start limit. Needs sissi:write.' }
                endDatetime: { type: string, format: date-time, nullable: true, description: 'ISO 8601 with UTC offset. From this moment the entry is not in any playlist. Must be after startDatetime. null = no end limit.' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeleteEntry
      security: [{ adminCookie: [] }]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /admin/screens/{screenId}/purge-expired:
    post:
      operationId: adminPurgeExpiredEntries
      description: Removes every entry whose endDatetime has passed (enabled or not). Needs sissi:write. Not for aggregates.
      security: [{ adminCookie: [] }]
      parameters:
        - { name: screenId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Number of removed entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenId: { type: string }
                  removed: { type: integer }
                  version: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/screens/{screenId}/pushes/{pushId}:
    patch:
      operationId: adminSetPushEnabled
      description: Enable or disable every entry of this push (live change).
      security: [{ adminCookie: [] }]
      parameters:
        - { name: screenId, in: path, required: true, schema: { type: string } }
        - { name: pushId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: adminDeletePushEntries
      description: Removes every entry that came from this push.
      security: [{ adminCookie: [] }]
      parameters:
        - { name: screenId, in: path, required: true, schema: { type: string } }
        - { name: pushId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /admin/screens/{screenId}/power/override:
    post:
      operationId: adminSetPowerOverride
      security: [{ adminCookie: [] }]
      parameters:
        - { name: screenId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties:
                override: { type: string, enum: [auto, on, off] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminScreen' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /power/desired:
    get:
      operationId: getPowerDesired
      description: Returns desired power states for screens assigned to the authenticated LAN agent.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Desired power state per device
          content:
            application/json:
              schema:
                type: object
                required: [lanId, serverTime, devices]
                properties:
                  lanId: { type: string }
                  serverTime: { type: string, format: date-time }
                  devices:
                    type: array
                    items:
                      type: object
                      required: [screenId, driver, desiredState]
                      properties:
                        screenId: { type: string }
                        driver: { type: string }
                        mac: { type: string, nullable: true }
                        ip: { type: string, nullable: true }
                        desiredState: { type: string, nullable: true, enum: [on, off] }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /power/report:
    post:
      operationId: postPowerReport
      description: Reports device reachability and last power action from a LAN agent.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [devices]
              properties:
                devices:
                  type: array
                  items:
                    type: object
                    required: [screenId, reachable]
                    properties:
                      screenId: { type: string }
                      reachable: { type: boolean }
                      lastAction: { type: string, nullable: true }
                      error: { type: string, nullable: true }
      responses:
        '200': { description: Recorded }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: Canva user token, SISSI_PUSH_KEY or (SISSI_AUTH_MODE both/tunnus) a Tunnus access token with sissi:write / sissi:operate from its groups }
    adminCookie: { type: apiKey, in: cookie, name: sissi_admin, description: 'Also requires header X-Sissi-Admin: 1 on writes' }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ErrorCode:
      type: string
      enum:
        - UNAUTHORIZED
        - TEAM_NOT_ALLOWED
        - FORBIDDEN
        - AUTH_NOT_CONFIGURED
        - SCREEN_NOT_FOUND
        - SCREEN_EXISTS
        - ENTRY_NOT_FOUND
        - PUSH_NOT_FOUND
        - INVALID_MODE
        - INVALID_ENABLED
        - INVALID_TITLE
        - INVALID_PAGES
        - INVALID_KIND
        - INVALID_SECONDS
        - INVALID_SCHEDULE
        - INVALID_SCREEN
        - PAGE_URL_NOT_ALLOWED
        - TOO_MANY_PAGES
        - BUSY
        - RATE_LIMITED
        - DOWNLOAD_FAILED
        - TOO_LARGE
        - UNSUPPORTED_TYPE
        - KIND_MISMATCH
        - VIDEO_TOO_LONG
        - INTERRUPTED
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Readable; never contains a signed URL query string }
    Screen:
      type: object
      required: [id, name, orientation, defaultImageSeconds, maxVideoSeconds, entryCount, playlistVersion]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
        kind: { type: string, enum: [screen, view, aggregate], description: Screens play on a display; views are embedded in web pages; aggregates join views (no items of their own) }
        name: { type: string }
        orientation: { type: string, enum: [landscape, vertical] }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        defaultImageSeconds: { type: integer, minimum: 1, maximum: 3600 }
        maxVideoSeconds: { type: integer, nullable: true, minimum: 1 }
        entryCount: { type: integer, description: All entries, enabled or not }
        enabledEntryCount: { type: integer, description: Entries that are live }
        playlistVersion: { type: integer }
        power: { $ref: '#/components/schemas/PowerConfig' }
        embed:
          type: object
          nullable: true
          properties:
            type: { type: string, enum: [carousel, single, gallery] }
            options:
              type: object
              properties:
                fit: { type: string, enum: [contain, cover] }
                aspect: { type: string, pattern: '^[1-9]\\d?:[1-9]\\d?$' }
                dots: { type: boolean }
            allowedOrigins:
              type: array
              items: { type: string, format: uri }
        members:
          type: array
          nullable: true
          items: { type: string }
        rights:
          type: array
          items: { type: string, enum: [read, write, operate] }
    ScreenInput:
      type: object
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,40}$', description: Create only }
        kind: { type: string, enum: [screen, view, aggregate], default: screen, description: Create only }
        name: { type: string, minLength: 1, maxLength: 100 }
        orientation: { type: string, enum: [landscape, vertical] }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        defaultImageSeconds: { type: integer, minimum: 1, maximum: 3600 }
        maxVideoSeconds: { type: integer, nullable: true, minimum: 1 }
        power: { $ref: '#/components/schemas/PowerConfig' }
        members:
          type: array
          items: { type: string }
          description: Aggregate only; view IDs in display order
    PowerConfig:
      type: object
      nullable: true
      properties:
        lanId: { type: string, nullable: true }
        routerId: { type: string, nullable: true }
        driver: { type: string, enum: [none, pull, samsung-lan, android-adb, wol-only, router-wol] }
        mac: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        override: { type: string, enum: [auto, on, off] }
        schedule:
          type: object
          nullable: true
          properties:
            timezone: { type: string }
            windows:
              type: array
              items:
                type: object
                required: [days, start, end]
                properties:
                  days: { type: array, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
                  start: { type: string, example: '08:00' }
                  end: { type: string, example: '20:00' }
    PowerStatus:
      type: object
      nullable: true
      properties:
        screenId: { type: string }
        lanId: { type: string, nullable: true }
        reachable: { type: boolean }
        lastAction: { type: string, nullable: true }
        error: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    Entry:
      type: object
      required: [entryId, mediaId, kind, seconds, title, pushId, addedAt]
      properties:
        entryId: { type: string }
        mediaId: { type: string, description: sha256 hex }
        kind: { type: string, enum: [image, video] }
        seconds: { type: integer }
        title: { type: string }
        pushId: { type: string }
        addedAt: { type: string, format: date-time }
        alt: { type: string, nullable: true, maxLength: 300, description: Alternative text with everything the image says }
        headline: { type: string, nullable: true, maxLength: 120, description: Title rendered on the image }
        caption: { type: string, nullable: true, maxLength: 500, description: Smaller text below the image }
        link: { type: string, nullable: true, description: Optional https link; the item is clickable }
        enabled:
          type: boolean
          description: Only enabled entries are in playlist.json. New pushes add entries disabled unless the push says enabled true. Entries stored before this field existed count as enabled.
        startDatetime: { type: string, format: date-time, nullable: true, description: Entry is shown from this moment (null = no start limit) }
        endDatetime: { type: string, format: date-time, nullable: true, description: Entry is not shown from this moment on (null = no end limit) }
    AdminScreen:
      allOf:
        - $ref: '#/components/schemas/Screen'
        - type: object
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/Entry' }
            powerStatus: { $ref: '#/components/schemas/PowerStatus' }
    PushRequest:
      type: object
      required: [screenId, title, pages]
      properties:
        screenId: { type: string }
        mode:
          type: string
          enum: [append, replace]
          default: append
          description: replace removes the screen's existing entries, so it is a live change and needs enabled true.
        enabled:
          type: boolean
          default: false
          description: false adds the entries disabled (content publishing, sissi:write). true makes them live at once (sissi:operate). Rights are enforced by the Tunnus work, not yet by this service.
        title: { type: string, minLength: 1, maxLength: 200 }
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [pageNumber, url]
            properties:
              pageNumber: { type: integer }
              kind: { type: string, enum: [image, video], description: Optional; service sniffs when omitted }
              url: { type: string, format: uri }
              seconds: { type: integer, minimum: 1, maximum: 3600, description: Images only; ignored for video }
              alt: { type: string, nullable: true, maxLength: 300 }
              headline: { type: string, nullable: true, maxLength: 120, description: Heading rendered on the image }
              caption: { type: string, nullable: true, maxLength: 500, description: Description rendered below the image }
              link: { type: string, nullable: true, format: uri, description: Optional HTTPS link for the entry }
    PushAccepted:
      type: object
      required: [pushId, taskId, state, screenId]
      properties:
        pushId: { type: string }
        taskId: { type: string }
        state: { type: string, enum: [queued] }
        screenId: { type: string }
    PushStatus:
      type: object
      required: [pushId, screenId, state, progress, pages, error, playlistVersion]
      properties:
        pushId: { type: string }
        screenId: { type: string }
        state: { type: string, enum: [queued, downloading, ready, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        pages:
          type: object
          properties: { done: { type: integer }, total: { type: integer } }
        error:
          nullable: true
          type: object
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
        playlistVersion: { type: integer, nullable: true }
 }
                dots: { type: boolean }
            allowedOrigins: { type: array, items: { type: string, format: uri } }
    ScreenInput:
      type: object
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,40}$', description: Create only }
        name: { type: string, minLength: 1, maxLength: 100 }
        orientation: { type: string, enum: [landscape, vertical] }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        defaultImageSeconds: { type: integer, minimum: 1, maximum: 3600 }
        maxVideoSeconds: { type: integer, nullable: true, minimum: 1 }
        power: { $ref: '#/components/schemas/PowerConfig' }
    PowerConfig:
      type: object
      nullable: true
      properties:
        lanId: { type: string, nullable: true }
        routerId: { type: string, nullable: true }
        driver: { type: string, enum: [none, pull, samsung-lan, android-adb, wol-only, router-wol] }
        mac: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        override: { type: string, enum: [auto, on, off] }
        schedule:
          type: object
          nullable: true
          properties:
            timezone: { type: string }
            windows:
              type: array
              items:
                type: object
                required: [days, start, end]
                properties:
                  days: { type: array, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] } }
                  start: { type: string, example: '08:00' }
                  end: { type: string, example: '20:00' }
    PowerStatus:
      type: object
      nullable: true
      properties:
        screenId: { type: string }
        lanId: { type: string, nullable: true }
        reachable: { type: boolean }
        lastAction: { type: string, nullable: true }
        error: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    Entry:
      type: object
      required: [entryId, mediaId, kind, seconds, title, pushId, addedAt]
      properties:
        entryId: { type: string }
        mediaId: { type: string, description: sha256 hex }
        kind: { type: string, enum: [image, video] }
        seconds: { type: integer }
        title: { type: string }
        pushId: { type: string }
        addedAt: { type: string, format: date-time }
        alt: { type: string, nullable: true, maxLength: 300, description: Alternative text with everything the image says }
        headline: { type: string, nullable: true, maxLength: 120, description: Title rendered on the image }
        caption: { type: string, nullable: true, maxLength: 500, description: Smaller text below the image }
        link: { type: string, nullable: true, description: Optional https link; the item is clickable }
        enabled:
          type: boolean
          description: Only enabled entries are in playlist.json. New pushes add entries disabled unless the push says enabled true. Entries stored before this field existed count as enabled.
        startDatetime: { type: string, format: date-time, nullable: true, description: Entry is shown from this moment (null = no start limit) }
        endDatetime: { type: string, format: date-time, nullable: true, description: Entry is not shown from this moment on (null = no end limit) }
    AdminScreen:
      allOf:
        - $ref: '#/components/schemas/Screen'
        - type: object
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/Entry' }
            powerStatus: { $ref: '#/components/schemas/PowerStatus' }
    PushRequest:
      type: object
      required: [screenId, title, pages]
      properties:
        screenId: { type: string }
        mode:
          type: string
          enum: [append, replace]
          default: append
          description: replace removes the screen's existing entries, so it is a live change and needs enabled true.
        enabled:
          type: boolean
          default: false
          description: false adds the entries disabled (content publishing, sissi:write). true makes them live at once (sissi:operate). Rights are enforced by the Tunnus work, not yet by this service.
        title: { type: string, minLength: 1, maxLength: 200 }
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [pageNumber, url]
            properties:
              pageNumber: { type: integer }
              kind: { type: string, enum: [image, video], description: Optional; service sniffs when omitted }
              url: { type: string, format: uri }
              seconds: { type: integer, minimum: 1, maximum: 3600, description: Images only; ignored for video }
    PushAccepted:
      type: object
      required: [pushId, taskId, state, screenId]
      properties:
        pushId: { type: string }
        taskId: { type: string }
        state: { type: string, enum: [queued] }
        screenId: { type: string }
    PushStatus:
      type: object
      required: [pushId, screenId, state, progress, pages, error, playlistVersion]
      properties:
        pushId: { type: string }
        screenId: { type: string }
        state: { type: string, enum: [queued, downloading, ready, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        pages:
          type: object
          properties: { done: { type: integer }, total: { type: integer } }
        error:
          nullable: true
          type: object
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
        playlistVersion: { type: integer, nullable: true }
